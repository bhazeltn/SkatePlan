# SkatePlan — unified SPA + API delivery
# Public URL: https://ab12b61bf.abacusai.cloud
# Platform ingress rewrites Host to ab12b61bf.vm.internal; include it plus a
# catch-all so cloud URL, custom domains, and localhost all match this block.
server {
    listen 80;
    server_name ab12b61bf.abacusai.cloud ab12b61bf.vm.internal localhost 127.0.0.1 _;

    root /home/ubuntu/skateplan/frontend/dist;
    index index.html;

    add_header Cache-Control "max-age=0, s-maxage=60";

    # SPA client-side routing: fall back to index.html for unknown paths.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # FastAPI application under /api/.
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Interactive API docs and schema (served by FastAPI).
    location /docs {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
    location /openapi.json {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
    }
}
